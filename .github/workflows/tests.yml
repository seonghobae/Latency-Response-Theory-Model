name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s validation -p 'test_*.py' -v
      - run: ruff check src/lart/api.py src/lart/synthetic.py src/lart/__init__.py data_generation validation/test_combined_count_contract.py validation/test_combined_pandas_loading.py
